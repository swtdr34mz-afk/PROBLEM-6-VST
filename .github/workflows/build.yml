# Builds PROPHET 67 for Windows (VST3, Standalone) and the Mac (VST3, AU, Standalone; Apple Silicon and Intel) on
# every push. The zips are under the run's "Artifacts"; a tag v* also makes a release with them.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # the engine's tests (tests/engine_tests.cpp): every preset at every rate, any buffer size, automation, a fuzz of
  # notes, the filter's tuning, the CPU; no JUCE needed
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Release && cmake --build build-tests --parallel 4
      - name: run
        run: build-tests/engine_tests

  # PROPHET 67 for the MPC (mpc/): the SDK project made from the shared engine, built with Akai's MPC Plugin SDK
  # (its Zig cross compiler: arm32 and arm64), checked by the SDK's own validator and host simulator and by
  # mpc/test/mpc_host_test.cpp (the MPC's host contract); the plugin folder zipped with its README
  mpc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: the MPC Plugin SDK (pinned)
        run: |
          git init -q mpc-sdk
          git -C mpc-sdk remote add origin https://github.com/inmusic-software/mpc-plugin-builder-sdk
          git -C mpc-sdk fetch -q --depth 1 origin a5949cf6fe2cbfb95bcbe0ddf1f7ef555e71f2be
          git -C mpc-sdk checkout -q FETCH_HEAD
      - name: build (native, arm32, arm64)
        run: python3 mpc/build.py --sdk mpc-sdk --target all
      - name: host test (the native build)
        run: |
          g++ -std=c++17 -O2 -Impc-sdk/framework mpc/test/mpc_host_test.cpp -ldl -o mpc_host_test
          ./mpc_host_test "mpc/build/PROPHET 67/build/native/prophet-67.so"
      - name: package
        run: |
          cd "mpc/build/PROPHET 67/build"
          file "swtdr34mz - VST - PROPHET 67/VST/"*.so
          cp "../README.md" "swtdr34mz - VST - PROPHET 67/README.md"
          zip -qr "$GITHUB_WORKSPACE/PROPHET67-MPC.zip" "swtdr34mz - VST - PROPHET 67"
      - uses: actions/upload-artifact@v4
        with:
          name: PROPHET67-MPC
          path: PROPHET67-MPC.zip

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          # the Mac: GitHub's macOS runners found no machine (Nov 2026); back in with these two lines
          # - os: macos-26
          #   name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: pluginval (Windows)
        # the plugin checked as a host would: loading, its parameters fuzzed, state saved and restored, the editor
        # opened, every buffer size and rate (Tracktion's pluginval, strictness 8)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $p = Start-Process -FilePath pluginval/pluginval.exe -ArgumentList '--strictness-level','8','--timeout-ms','600000','--output-dir','pluginval-log','--validate','"build/Prophet67_artefacts/Release/VST3/PROPHET 67.vst3"' -Wait -PassThru -NoNewWindow
          Get-ChildItem pluginval-log -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName | Select-Object -Last 60 }
          if ($p.ExitCode -ne 0) { throw "pluginval failed ($($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: pluginval-log
          path: pluginval-log
          if-no-files-found: ignore

      - name: package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $a = "build/Prophet67_artefacts/Release"
          $o = "PROPHET67-Windows"
          New-Item -ItemType Directory -Force $o | Out-Null
          Copy-Item -Recurse "$a/VST3/PROPHET 67.vst3" $o/
          Copy-Item "$a/Standalone/PROPHET 67.exe" $o/
          Copy-Item README.md $o/
          Compress-Archive -Path $o -DestinationPath PROPHET67-Windows.zip

      - name: package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          a="build/Prophet67_artefacts/Release"
          o=PROPHET67-macOS
          mkdir -p $o
          cp -R "$a/VST3/PROPHET 67.vst3" "$a/AU/PROPHET 67.component" "$a/Standalone/PROPHET 67.app" $o/
          for b in $o/*.vst3 $o/*.component $o/*.app; do codesign --force --deep -s - "$b"; done
          lipo -info "$o/PROPHET 67.vst3/Contents/MacOS/PROPHET 67"
          cp README.md $o/
          ditto -c -k --sequesterRsrc --keepParent $o $o.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PROPHET67-${{ matrix.name }}
          path: PROPHET67-*.zip

      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PROPHET67-*.zip
