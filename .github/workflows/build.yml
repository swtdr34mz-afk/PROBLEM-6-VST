# Builds PROBLEM 6 (formerly PROPHET 67) for Windows (VST3, Standalone) and the Mac (VST3, AU, Standalone; Apple Silicon and Intel) on
# every push. The zips are under the run's "Artifacts"; a tag v* (or a release published on GitHub) also puts them
# in its release.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  release:                               # a release published on GitHub (its tag v*): the zips added to it
    types: [published]

permissions:
  contents: write

jobs:
  # the engine's tests (tests/engine_tests.cpp): every preset at every rate, any buffer size, automation, a fuzz of
  # notes, the filter's tuning, the CPU; no JUCE needed
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Release && cmake --build build-tests --parallel 4
      - name: run
        run: build-tests/engine_tests

  # PROBLEM 6 for the MPC (formerly PROPHETIC 6; mpc/): the SDK project made from the shared engine, built with Akai's MPC Plugin SDK
  # (its Zig cross compiler: arm32 and arm64), checked by the SDK's own validator and host simulator and by
  # mpc/test/mpc_host_test.cpp (the MPC's host contract); the plugin folder zipped with its README
  mpc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: the MPC Plugin SDK (pinned)
        run: |
          git init -q mpc-sdk
          git -C mpc-sdk remote add origin https://github.com/inmusic-software/mpc-plugin-builder-sdk
          git -C mpc-sdk fetch -q --depth 1 origin a5949cf6fe2cbfb95bcbe0ddf1f7ef555e71f2be
          git -C mpc-sdk checkout -q FETCH_HEAD
      # a tag v*: the MPC plugin's version is the tag's (plugin.json follows it), so the VST and the MPC always match
      - name: version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          sed -i -E "s/\"version\": \"[^\"]*\"/\"version\": \"$v\"/" mpc/plugin/plugin.json
          grep '"version"' mpc/plugin/plugin.json
      - name: build (native, arm32, arm64)
        run: python3 mpc/build.py --sdk mpc-sdk --target all
      - name: host test (the native build)
        run: |
          g++ -std=c++17 -O2 -Impc-sdk/framework mpc/test/mpc_host_test.cpp -ldl -o mpc_host_test
          ./mpc_host_test "mpc/build/PROBLEM 6/build/native/problem-6.so"
      - name: package
        run: |
          cd "mpc/build/PROBLEM 6/build"
          file "swtdr34mz - VST - PROBLEM 6/VST/"*.so
          cp "../README.md" "swtdr34mz - VST - PROBLEM 6/README.md"
          zip -qr "$GITHUB_WORKSPACE/PROBLEM6-MPC.zip" "swtdr34mz - VST - PROBLEM 6"
      - uses: actions/upload-artifact@v4
        with:
          name: PROBLEM6-MPC
          path: PROBLEM6-MPC.zip
      # the Open MPC catalog's own zips: its tools (pinned) turn the SDK folder into one zip per CPU
      # (<Name>-<version>-mpc-armv7.zip / -mpc-aarch64.zip, with install.sh and mpc-plugin.json), checked with its
      # catalog_check.py --catalog; the output and each zip's SHA-256 go in the job summary (for the catalog PR)
      - name: the Open MPC catalog's tools (pinned)
        run: |
          git init -q openmpc
          git -C openmpc remote add origin https://github.com/open-mpc/mpc-vst-plugins
          git -C openmpc fetch -q --depth 1 origin aa81004516da80490a79b493061723513c438ff6
          git -C openmpc checkout -q FETCH_HEAD
      - name: catalog zips (per CPU) and the SDK zip
        run: |
          v=$(python3 -c "import json; print(json.load(open('mpc/plugin/plugin.json'))['version'])")
          python3 openmpc/tools/sdk_release.py "mpc/build/PROBLEM 6/build/swtdr34mz - VST - PROBLEM 6" --version "$v" \
            --id prophetic-6 --repo swtdr34mz-afk/PROPHET-67-VST --license MPL-2.0 -o dist \
            -- --retire "swtdr34mz - VST - PROPHETIC 6"
          cp PROBLEM6-MPC.zip "dist/PROBLEM-6-$v-mpc-sdk.zip"
          {
            echo "## Open MPC catalog zips ($v)"
            for z in dist/*-mpc-armv7.zip dist/*-mpc-aarch64.zip; do
              echo; echo "### $(basename "$z")"; echo '```'
              python3 openmpc/tools/catalog_check.py "$z" --catalog --expect-id prophetic-6 --expect-repo swtdr34mz-afk/PROPHET-67-VST 2>&1
              echo '```'
            done
            echo; echo "### SHA-256"; echo '```'; (cd dist && sha256sum *.zip); echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          for z in dist/*-mpc-armv7.zip dist/*-mpc-aarch64.zip; do
            python3 openmpc/tools/catalog_check.py "$z" --catalog --expect-id prophetic-6 --expect-repo swtdr34mz-afk/PROPHET-67-VST > /dev/null
          done
      - uses: actions/upload-artifact@v4
        with:
          name: PROBLEM6-catalog
          path: dist/*.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'release' || github.event_name == 'push')
        with:
          files: dist/*.zip

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          # the Mac: on GitHub's Intel Mac (the Apple Silicon runners found no machine, Nov 2026); the plugins are
          # built for both Apple Silicon and Intel in one file (CMAKE_OSX_ARCHITECTURES), as for NIQUE D0
          - os: macos-15-intel
            name: macOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: pluginval (Windows)
        # the plugin checked as a host would: loading, its parameters fuzzed, state saved and restored, the editor
        # opened, every buffer size and rate (Tracktion's pluginval, strictness 8)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $p = Start-Process -FilePath pluginval/pluginval.exe -ArgumentList '--strictness-level','8','--timeout-ms','600000','--output-dir','pluginval-log','--validate','"build/Prophet67_artefacts/Release/VST3/PROBLEM 6.vst3"' -Wait -PassThru -NoNewWindow
          Get-ChildItem pluginval-log -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName | Select-Object -Last 60 }
          if ($p.ExitCode -ne 0) { throw "pluginval failed ($($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: pluginval-log
          path: pluginval-log
          if-no-files-found: ignore

      - name: package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $a = "build/Prophet67_artefacts/Release"
          $o = "PROBLEM6-Windows"
          New-Item -ItemType Directory -Force $o | Out-Null
          Copy-Item -Recurse "$a/VST3/PROBLEM 6.vst3" $o/
          Copy-Item "$a/Standalone/PROBLEM 6.exe" $o/
          Copy-Item README.md $o/
          Compress-Archive -Path $o -DestinationPath PROBLEM6-Windows.zip

      - name: auval (macOS)
        # the Audio Unit checked as Logic and Ableton check it (informative: a failure here does not stop the build)
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/Prophet67_artefacts/Release/AU/PROBLEM 6.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Ph67 Swtd

      - name: package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          a="build/Prophet67_artefacts/Release"
          o=PROBLEM6-macOS
          mkdir -p $o
          cp -R "$a/VST3/PROBLEM 6.vst3" "$a/AU/PROBLEM 6.component" "$a/Standalone/PROBLEM 6.app" $o/
          for b in $o/*.vst3 $o/*.component $o/*.app; do codesign --force --deep -s - "$b"; done
          lipo -info "$o/PROBLEM 6.vst3/Contents/MacOS/PROBLEM 6"
          cp README.md $o/
          ditto -c -k --sequesterRsrc --keepParent $o $o.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PROBLEM6-${{ matrix.name }}
          path: PROBLEM6-*.zip

      - name: release
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'release' || github.event_name == 'push')
        uses: softprops/action-gh-release@v2
        with:
          files: PROBLEM6-*.zip
