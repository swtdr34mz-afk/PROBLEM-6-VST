# Builds PROPHET 67 for Windows (VST3, Standalone) and the Mac (VST3, AU, Standalone; Apple Silicon and Intel) on
# every push. The zips are under the run's "Artifacts"; a tag v* also makes a release with them.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-26
            name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $a = "build/Prophet67_artefacts/Release"
          $o = "PROPHET67-Windows"
          New-Item -ItemType Directory -Force $o | Out-Null
          Copy-Item -Recurse "$a/VST3/PROPHET 67.vst3" $o/
          Copy-Item "$a/Standalone/PROPHET 67.exe" $o/
          Copy-Item README.md $o/
          Compress-Archive -Path $o -DestinationPath PROPHET67-Windows.zip

      - name: package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          a="build/Prophet67_artefacts/Release"
          o=PROPHET67-macOS
          mkdir -p $o
          cp -R "$a/VST3/PROPHET 67.vst3" "$a/AU/PROPHET 67.component" "$a/Standalone/PROPHET 67.app" $o/
          for b in $o/*.vst3 $o/*.component $o/*.app; do codesign --force --deep -s - "$b"; done
          lipo -info "$o/PROPHET 67.vst3/Contents/MacOS/PROPHET 67"
          cp README.md $o/
          ditto -c -k --sequesterRsrc --keepParent $o $o.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PROPHET67-${{ matrix.name }}
          path: PROPHET67-*.zip

      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PROPHET67-*.zip
